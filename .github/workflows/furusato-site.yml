# ふるさと納税コスパ比較サイトを、毎日自動で更新して Cloudflare Pages に公開します。
# 必要な設定(GitHub の Settings → Secrets and variables → Actions):
#   Secrets: RAKUTEN_APPLICATION_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID / RAKUTEN_REFERER
#            CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   Variables: FURUSATO_BASE_URL(例: https://furusato-cospa.pages.dev) / CF_PAGES_PROJECT(例: furusato-cospa)
# くわしくは sites/README.md を読んでください。
name: furusato-site

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 5:17(日本時間)
  workflow_dispatch: {}      # Actions の画面から手動でも実行できる

permissions:
  contents: write            # 価格の記録(history.csv)を保存するため

concurrency:
  group: furusato-site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テスト
        run: python -m unittest discover -s tests

      - name: 楽天APIから取得
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
        run: python sites/furusato/fetch.py

      - name: サイトを作る
        env:
          FURUSATO_BASE_URL: ${{ vars.FURUSATO_BASE_URL }}
        run: python sites/furusato/build.py

      - name: Cloudflare Pages のプロジェクトを用意(初回だけ作成、2回目以降は何もしない)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT }} --production-branch=main

      - name: Cloudflare Pages に公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/furusato --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main

      - name: 価格の記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/furusato/data/history.csv
          git diff --cached --quiet || git commit -m "ふるさと納税: 価格の記録を更新 ($(date +%F))"
          git push
