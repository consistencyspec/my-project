# 2つのサイトの最新の数字から、Threads と X の投稿の下書きを毎朝作って drafts/social/ に保存します。
# 投稿はしません(内容を確かめて、自分の手で投稿します)。
name: social-drafts

on:
  schedule:
    - cron: "13 22 * * *"   # 毎日 7:13(日本時間)。サイトの更新(5時台)のあと
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下書きを作る
        run: TZ=Asia/Tokyo python sites/social/make_posts.py

      - name: 下書きを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/social
          git diff --cached --quiet || git commit -m "SNS投稿の下書き ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin main
          git push
