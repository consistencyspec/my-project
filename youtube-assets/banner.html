<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:2560px;height:1440px}
.b{position:relative;width:2560px;height:1440px;overflow:hidden;background:linear-gradient(120deg,#0B1524 0%,#13233B 50%,#0B1524 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(232,176,75,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(232,176,75,.06) 1px,transparent 1px);background-size:80px 80px}
svg{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;top:600px;text-align:center;font-family:'Dela Gothic One';font-size:150px;line-height:1;color:#F5EFE3;letter-spacing:6px}
.t span{color:#E8B04B}
.tag{position:absolute;left:0;right:0;top:530px;text-align:center;font-family:'Noto Sans JP';font-weight:700;font-size:44px;letter-spacing:10px;color:#E8B04B}
.sub{position:absolute;left:0;right:0;top:790px;text-align:center;font-family:'Noto Sans JP';font-weight:500;font-size:40px;letter-spacing:6px;color:#C9D3E0}
</style></head><body><div class="b"><div class="grid"></div>
<svg viewBox="0 0 2560 1440">
 <line x1="0" y1="900" x2="2560" y2="900" stroke="#E8B04B" stroke-opacity=".35" stroke-width="3"/>
 <line x1="0" y1="900" x2="1280" y2="900" stroke="#E8B04B" stroke-width="5" stroke-dasharray="4 18" stroke-opacity=".0"/>
 <g fill="#0B1524" stroke="#E8B04B" stroke-width="4" stroke-opacity=".45">
  <circle cx="160" cy="900" r="12"/><circle cx="480" cy="900" r="12"/><circle cx="800" cy="900" r="12"/>
  <circle cx="1760" cy="900" r="12"/><circle cx="2080" cy="900" r="12"/><circle cx="2400" cy="900" r="12"/>
 </g>
 <circle cx="1280" cy="900" r="22" fill="#E8B04B"/><circle cx="1280" cy="900" r="44" fill="none" stroke="#E8B04B" stroke-opacity=".4" stroke-width="3"/>
 <circle cx="2250" cy="330" r="420" fill="none" stroke="#E8B04B" stroke-opacity=".08" stroke-width="40"/>
 <circle cx="260" cy="1200" r="300" fill="none" stroke="#E8B04B" stroke-opacity=".07" stroke-width="30"/>
</svg>
<div class="tag">昨日の常識を、アップデートする。</div>
<div class="t">新常識<span>クロニクル</span></div>
<div class="sub">知らないと損する "いまの常識" を、わかりやすく。</div>
</div></body></html>
